<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบบัญชีค่ายต้นกล้า</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #16a34a; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* ซ่อน scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-green-600 font-bold" id="loadingText">กำลังซิงค์ข้อมูล...</p>
    </div>

    <!-- Main Container -->
    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col relative pb-20">
        
        <!-- Header -->
        <div class="bg-green-600 text-white p-4 flex justify-between items-center sticky top-0 z-40 shadow-md">
            <h1 class="text-lg font-bold">🌱 บัญชีค่ายต้นกล้าฯ</h1>
            <button id="adminBtn" onclick="toggleAdmin()" class="bg-black/20 px-3 py-1 rounded-full text-sm flex items-center gap-1 transition-colors">
                <span id="adminIcon">🔒</span> <span id="adminText">โหมดดูข้อมูล</span>
            </button>
        </div>

        <!-- Dashboard / Summary -->
        <div class="p-4 bg-green-50 border-b border-green-100">
            <div class="grid grid-cols-3 gap-2 text-center mb-4">
                <div class="bg-white p-2 rounded shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 mb-1">รายรับรวม</p>
                    <p class="text-sm font-bold text-green-600" id="totalIncome">0</p>
                </div>
                <div class="bg-white p-2 rounded shadow-sm border border-gray-100">
                    <p class="text-xs text-gray-500 mb-1">รายจ่ายรวม</p>
                    <p class="text-sm font-bold text-red-500" id="totalExpense">0</p>
                </div>
                <div class="bg-green-600 p-2 rounded shadow-sm text-white">
                    <p class="text-xs text-green-100 mb-1">คงเหลือ</p>
                    <p class="text-sm font-bold" id="balance">0</p>
                </div>
            </div>
            
            <div class="bg-white p-3 rounded shadow-sm border border-gray-100">
                <p class="text-xs font-bold text-center text-gray-500 mb-2">สัดส่วนรายจ่ายแยกตามฝ่าย</p>
                <div class="relative h-40 w-full flex justify-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Input Form (Hidden by default, shown when Admin) -->
        <div id="formSection" class="p-4 hidden bg-gray-50 border-b">
            <h2 class="font-bold mb-3 text-gray-700 flex items-center gap-2">📝 บันทึกรายการใหม่</h2>
            
            <div class="flex gap-2 mb-3">
                <button type="button" id="btnIncome" onclick="setType('income')" class="flex-1 py-2 rounded-lg font-bold border-2 border-green-600 bg-green-600 text-white transition-colors">รายรับ</button>
                <button type="button" id="btnExpense" onclick="setType('expense')" class="flex-1 py-2 rounded-lg font-bold border-2 border-gray-300 bg-white text-gray-500 transition-colors">รายจ่าย</button>
            </div>

            <div class="mb-3">
                <label class="block text-sm text-gray-600 mb-1">จำนวนเงิน (บาท)</label>
                <input type="number" id="amount" class="w-full border p-2 rounded-lg text-lg font-bold text-right focus:ring-2 focus:ring-green-500 outline-none" placeholder="0">
            </div>

            <div class="mb-3">
                <label class="block text-sm text-gray-600 mb-1">หมวดหมู่</label>
                <select id="category" class="w-full border p-2 rounded-lg bg-white outline-none focus:ring-2 focus:ring-green-500"></select>
            </div>

            <div class="mb-4">
                <label class="block text-sm text-gray-600 mb-1">รายละเอียด / หมายเหตุ</label>
                <input type="text" id="description" class="w-full border p-2 rounded-lg outline-none focus:ring-2 focus:ring-green-500" placeholder="เช่น ค่าสมัครน้อง A, ค่าเตาแก๊ส...">
            </div>

            <button onclick="saveData()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors">
                💾 บันทึกข้อมูล
            </button>
        </div>

        <!-- History List -->
        <div class="p-4 flex-1">
            <h2 class="font-bold mb-3 text-gray-700">ประวัติการเบิกจ่าย</h2>
            <div id="transactionList" class="space-y-3 pb-4">
                <!-- Transactions will be rendered here -->
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // ลิงก์ API จาก Google Apps Script (ใส่ให้เรียบร้อยแล้ว ห้ามแก้ไข)
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx18hQIRLRDow5Jvq6KzhFJeLEfw-W_KSs-IJAmWb2OC3KwMsYX-WytDJiz6SsDJ01h/exec';
        
        let isAdmin = false;
        let currentType = 'income';
        let transactions = [];
        let expenseChartInstance = null;

        const categories = {
            income: ['สปอนเซอร์', 'ซองอนุเคราะห์', 'เปิดรับบริจาค (ตลาด)', 'รับบริจาคมื้ออาหาร', 'ค่าสมัคร', 'อื่นๆ'],
            expense: ['ฝ่ายกิจกรรม', 'ฝ่ายครัวและโภชนาการ', 'ฝ่ายบริการและสถานที่', 'ฝ่ายกีฬา', 'ฝ่าย PR และสื่อ', 'ฝ่ายวิชาการและอิบาดะห์', 'ฝ่ายมุร็อบบี้', 'อื่นๆ']
        };

        // เริ่มต้นการทำงาน
        window.onload = () => {
            updateCategoryDropdown();
            fetchData();
        };

        // เปลี่ยนประเภทรับ-จ่าย
        function setType(type) {
            currentType = type;
            const btnInc = document.getElementById('btnIncome');
            const btnExp = document.getElementById('btnExpense');
            
            if (type === 'income') {
                btnInc.className = 'flex-1 py-2 rounded-lg font-bold border-2 border-green-600 bg-green-600 text-white transition-colors';
                btnExp.className = 'flex-1 py-2 rounded-lg font-bold border-2 border-gray-300 bg-white text-gray-500 transition-colors';
            } else {
                btnExp.className = 'flex-1 py-2 rounded-lg font-bold border-2 border-red-500 bg-red-500 text-white transition-colors';
                btnInc.className = 'flex-1 py-2 rounded-lg font-bold border-2 border-gray-300 bg-white text-gray-500 transition-colors';
            }
            updateCategoryDropdown();
        }

        function updateCategoryDropdown() {
            const select = document.getElementById('category');
            select.innerHTML = '';
            categories[currentType].forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
        }

        // ระบบแอดมิน
        function toggleAdmin() {
            if (isAdmin) {
                isAdmin = false;
                updateAdminUI();
                alert('ออกจากโหมดแอดมินแล้ว');
            } else {
                const pass = prompt('กรุณาใส่รหัสผ่านแอดมิน:');
                if (pass === '2569') {
                    isAdmin = true;
                    updateAdminUI();
                } else if (pass !== null) {
                    alert('รหัสผ่านไม่ถูกต้อง');
                }
            }
        }

        function updateAdminUI() {
            const btn = document.getElementById('adminBtn');
            const form = document.getElementById('formSection');
            
            if (isAdmin) {
                btn.classList.replace('bg-black/20', 'bg-red-500');
                document.getElementById('adminIcon').textContent = '🔓';
                document.getElementById('adminText').textContent = 'โหมดแก้ไข';
                form.classList.remove('hidden');
            } else {
                btn.classList.replace('bg-red-500', 'bg-black/20');
                document.getElementById('adminIcon').textContent = '🔒';
                document.getElementById('adminText').textContent = 'โหมดดูข้อมูล';
                form.classList.add('hidden');
            }
            renderList(); // รีโหลดปุ่มลบ
        }

        // แสดง Overlay โหลดข้อมูล
        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // ดึงข้อมูลจาก Google Sheets
        function fetchData() {
            showLoading('กำลังซิงค์ข้อมูล...');
            fetch(SCRIPT_URL + '?action=get', {
                method: 'GET',
                redirect: 'follow'
            })
            .then(res => res.json())
            .then(data => {
                transactions = data;
                renderList();
                updateDashboard();
                hideLoading();
            })
            .catch(err => {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณารีเฟรชหน้าเว็บ');
                hideLoading();
            });
        }

        // บันทึกข้อมูล
        function saveData() {
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;

            if (!amount || amount <= 0) {
                alert('กรุณากรอกจำนวนเงินให้ถูกต้อง');
                return;
            }
            if (!description) {
                alert('กรุณากรอกรายละเอียด');
                return;
            }

            const payload = {
                action: 'save',
                data: {
                    type: currentType,
                    amount: amount,
                    category: category,
                    description: description,
                    displayTime: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
                }
            };

            showLoading('กำลังบันทึกข้อมูล...');
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    // ล้างฟอร์ม
                    document.getElementById('amount').value = '';
                    document.getElementById('description').value = '';
                    fetchData(); // โหลดข้อมูลใหม่
                }
            })
            .catch(err => {
                console.error(err);
                alert('บันทึกไม่สำเร็จ ตรวจสอบการเชื่อมต่ออินเทอร์เน็ต');
                hideLoading();
            });
        }

        // ลบข้อมูล
        function deleteTransaction(rowNumber) {
            if(!confirm('ต้องการลบรายการนี้ใช่หรือไม่?')) return;
            
            showLoading('กำลังลบข้อมูล...');
            fetch(SCRIPT_URL, {
                method: 'POST',
                redirect: 'follow',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'delete', rowNumber: rowNumber })
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === 'success') {
                    fetchData();
                }
            })
            .catch(err => {
                console.error(err);
                alert('ลบข้อมูลไม่สำเร็จ');
                hideLoading();
            });
        }

        // แสดงรายการ
        function renderList() {
            const list = document.getElementById('transactionList');
            list.innerHTML = '';

            if (transactions.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 py-4">ยังไม่มีรายการบันทึก</p>';
                return;
            }

            transactions.forEach(t => {
                const isIncome = t.type === 'รายรับ';
                const sign = isIncome ? '+' : '-';
                const color = isIncome ? 'text-green-600' : 'text-red-500';
                
                let html = `
                    <div class="bg-white border rounded-lg p-3 shadow-sm flex justify-between items-center">
                        <div class="flex-1">
                            <div class="flex items-center gap-2">
                                <span class="text-xs text-gray-500 font-mono">${t.time}</span>
                                <span class="px-2 py-0.5 rounded text-[10px] bg-gray-100 text-gray-600 border">${t.category}</span>
                            </div>
                            <p class="font-bold text-gray-800 mt-1 text-sm">${t.description}</p>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <span class="font-bold ${color} text-lg">${sign} ${t.amount.toLocaleString()}</span>
                            ${isAdmin ? `<button onclick="deleteTransaction(${t.rowNumber})" class="text-red-300 hover:text-red-600 text-xl">🗑️</button>` : ''}
                        </div>
                    </div>
                `;
                list.innerHTML += html;
            });
        }

        // คำนวณและแสดงกราฟ
        function updateDashboard() {
            let inc = 0, exp = 0;
            let expenseByCategory = {};

            transactions.forEach(t => {
                const amount = parseFloat(t.amount);
                if (t.type === 'รายรับ') {
                    inc += amount;
                } else {
                    exp += amount;
                    expenseByCategory[t.category] = (expenseByCategory[t.category] || 0) + amount;
                }
            });

            document.getElementById('totalIncome').textContent = inc.toLocaleString();
            document.getElementById('totalExpense').textContent = exp.toLocaleString();
            document.getElementById('balance').textContent = (inc - exp).toLocaleString();

            // อัปเดตกราฟ
            const labels = Object.keys(expenseByCategory);
            const data = Object.values(expenseByCategory);
            
            if (expenseChartInstance) {
                expenseChartInstance.destroy();
            }

            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            if (labels.length === 0) {
                // กรณียังไม่มีรายจ่าย
                expenseChartInstance = new Chart(ctx, {
                    type: 'doughnut',
                    data: { labels: ['ยังไม่มีข้อมูลรายจ่าย'], datasets: [{ data: [1], backgroundColor: ['#f3f4f6'] }] },
                    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                });
                return;
            }

            expenseChartInstance = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#8b5cf6', '#ec4899']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right', labels: { boxWidth: 10, font: { size: 10 } } }
                    }
                }
            });
        }
    </script>
</body>
</html>
